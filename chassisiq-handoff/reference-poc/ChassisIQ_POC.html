<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChassisIQ: cost and specification studio (POC for Amber)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --pine:#0E2E25; --pine-2:#173F35; --pine-3:#22564A;
  --fog:#E8EEEA; --paper:#FBFCFA; --paper-2:#F3F6F4;
  --ink:#15201B; --ink-2:#465650; --ink-3:#7A8781;
  --line:#D3DCD7; --line-2:#E3E9E5;
  --mint:#36C79A; --mint-ink:#0C6A4E; --mint-wash:#DDF5EC;
  --up:#B8392A; --up-wash:#FBE7E3; --down:#1A8259; --down-wash:#DFF3E9;
  --warn:#9A6A08; --warn-wash:#FBF0D6;
  --cu:#B5622D; --al:#2F7FC1; --pl:#C79A1E; --rf:#1E9C94; --cp:#8A57A8; --st:#6E8A2A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --r-sm:6px; --r:10px; --r-lg:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-size:14px;line-height:1.5;color:var(--ink);background:var(--fog);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:4px}
a{color:var(--mint-ink)}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}
.small{font-size:12.5px}
.hide{display:none!important}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--pine);color:#E7F1EC}
.login-art{position:relative;overflow:hidden;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between}
.fins{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.login-art .brand{position:relative;z-index:1}
.login-hero{position:relative;z-index:1}
.login-hero h1{font-size:64px;line-height:.98;font-weight:700;letter-spacing:-.03em;max-width:9ch;color:#fff}
.login-hero p{max-width:46ch;color:#A9C4B9;font-size:16px;margin-top:18px}
.login-stack{position:relative;z-index:1;display:flex;gap:28px;color:#A9C4B9;font-size:13px}
.login-stack b{display:block;font-family:var(--display);font-size:26px;color:#fff;font-weight:600}
.login-pick{background:var(--fog);color:var(--ink);padding:48px 56px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.login-pick h2{font-size:24px;margin-bottom:4px}
.role-card{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s, transform .15s}
.role-card:hover{border-color:var(--pine-3);transform:translateX(3px)}
.role-card .av{width:44px;height:44px}
.role-card .can{font-size:12px;color:var(--ink-3)}
.role-card .go{color:var(--ink-3);font-size:18px}

.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cu),#E2A06A);position:relative;flex:none}
.mark:after{content:"";position:absolute;inset:7px 6px;background:repeating-linear-gradient(90deg,rgba(14,46,37,.75) 0 2px,transparent 2px 5px);border-radius:2px}
.brand-name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:#fff}
.brand-for{font-size:11.5px;color:#8FB0A3;line-height:1.2}

.av{border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}

/* ---------- shell ---------- */
.deck{background:var(--pine);color:#DCEAE3;position:sticky;top:0;z-index:30}
.deck-top{display:flex;align-items:center;gap:18px;padding:10px 22px}
.deck-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;color:#9DB8AC;font-size:13px}
.deck-search kbd{margin-left:auto;font-family:var(--body);font-size:11px;border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:0 5px}
.source-switch{display:flex;align-items:center;background:rgba(0,0,0,.25);border-radius:999px;padding:3px;gap:2px}
.source-switch button{border:0;background:transparent;color:#9DB8AC;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.source-switch button.on{background:#fff;color:var(--pine)}
.source-switch .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.source-switch button.on.aicm .dot{background:var(--mint);box-shadow:0 0 0 3px rgba(54,199,154,.25)}
.source-label{font-size:11.5px;color:#8FB0A3}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;padding:4px 6px 4px 4px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff}
.who .r{font-size:11.5px;color:#9DB8AC;display:block;line-height:1.1}
.who .n{font-size:13px;line-height:1.2;display:block;text-align:left}

.ticker{border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden;white-space:nowrap;background:#0B261F}
.ticker-track{display:inline-flex;animation:tick 60s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:10px;padding:7px 22px;border-right:1px solid rgba(255,255,255,.07);font-size:12.5px}
.tk .nm{color:#9DB8AC}
.tk .px{color:#fff;font-weight:600}
.tk .ch.up{color:#F08A78}.tk .ch.dn{color:#6EDDB4}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

.tabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;color:#9DB8AC;padding:11px 12px 12px;font-size:13.5px;font-weight:500;position:relative;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:#fff}
.tab.on{color:#fff}
.tab.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--mint)}
.tab.locked{opacity:.45}
.tab .cnt{background:rgba(255,255,255,.12);border-radius:999px;font-size:11px;padding:0 6px;color:#fff}

.view{padding:26px 28px 80px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .t{flex:1;min-width:260px}
.page-head p{margin:6px 0 0;color:var(--ink-2);max-width:72ch}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--ink-3);text-decoration:none}.crumbs a:hover{color:var(--ink)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 13px;font-weight:500;font-size:13.5px;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-2)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#06281D}
.btn.danger{color:var(--up);border-color:#E9C2BB}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .sp{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.panel-h h3{flex:1}
.panel-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr)}
@media (max-width:1100px){.g2,.g3,.g4,.g-main{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.chip.mint{background:var(--mint-wash);color:var(--mint-ink);border-color:#BDE9D8}
.chip.warn{background:var(--warn-wash);color:var(--warn);border-color:#F0DCA8}
.chip.up{background:var(--up-wash);color:var(--up);border-color:#F0C9C1}
.chip.down{background:var(--down-wash);color:var(--down);border-color:#BFE5D1}
.chip.dark{background:var(--pine);color:#fff;border-color:var(--pine)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--paper-2)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.tbl input.cell{width:96px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#fff}
.tbl input.cell:focus{border-color:var(--mint)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp,.sel,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.inp:focus,.sel:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px rgba(54,199,154,.18)}
.inp[readonly]{background:var(--paper-2);color:var(--ink-2)}

.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi .f{font-size:12px;color:var(--ink-3);margin-top:2px}

.mat{display:inline-flex;align-items:center;gap:6px}
.mat i{width:9px;height:9px;border-radius:3px;display:inline-block}
.lock-note{display:flex;gap:12px;align-items:center;padding:28px;border:1px dashed var(--line);border-radius:var(--r-lg);background:var(--paper);color:var(--ink-2)}
.lock-note .ic{width:40px;height:40px;border-radius:10px;background:var(--paper-2);display:grid;place-items:center;font-size:18px}

/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%}
.st-NEW{background:#EDE7F6;color:#5B3D8C}.st-NEW i{background:#7E57C2}
.st-ALLOCATED,.st-RND{background:#E3EEF9;color:#1F5E99}.st-ALLOCATED i,.st-RND i{background:#2F7FC1}
.st-SUBMITTED{background:var(--warn-wash);color:var(--warn)}.st-SUBMITTED i{background:#C79A1E}
.st-RETURNED{background:var(--up-wash);color:var(--up)}.st-RETURNED i{background:var(--up)}
.st-APPROVED,.st-COSTING{background:#E2F2F1;color:#126C66}.st-APPROVED i,.st-COSTING i{background:var(--rf)}
.st-COSTED{background:var(--mint-wash);color:var(--mint-ink)}.st-COSTED i{background:var(--mint)}
.st-SENT{background:var(--pine);color:#fff}.st-SENT i{background:var(--mint)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;border-radius:var(--r);overflow:hidden}
.pipe .stg{background:var(--paper-2);padding:12px 12px 14px;position:relative}
.pipe .stg b{font-family:var(--display);font-size:24px;font-weight:600;display:block}
.pipe .stg span{font-size:12px;color:var(--ink-2)}
.pipe .stg.hot{background:var(--pine);color:#fff}.pipe .stg.hot span{color:#A9C4B9}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 16px 26px}
.tl li:before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl li .b{position:absolute;left:0;top:3px;width:15px;height:15px;border-radius:50%;border:2px solid var(--paper);background:var(--mint);box-shadow:0 0 0 1px var(--line)}
.tl li.pend .b{background:var(--paper-2)}
.tl .w{font-size:12px;color:var(--ink-3)}

/* stepper (workflow) */
.flow{display:flex;gap:0;align-items:stretch;margin:4px 0 18px;overflow-x:auto}
.flow .s{flex:1;min-width:120px;padding:10px 12px;border-top:3px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.flow .s b{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.flow .s.done{border-top-color:var(--mint)}
.flow .s.done b{color:var(--ink)}
.flow .s.now{border-top-color:var(--pine)}
.flow .s.now b{color:var(--pine)}

/* spec sheet */
.spec-sec{margin-bottom:6px}
.spec-sec h4{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--ink-2);padding:12px 10px 6px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.spec-row{display:grid;grid-template-columns:34px minmax(180px,1.1fr) minmax(160px,1.4fr) 110px;gap:10px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line-2)}
.spec-row .no{color:var(--ink-3);font-size:12px}
.spec-row input{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;width:100%}
.spec-row input:not([readonly]){border-color:var(--line);background:#fff}
.spec-row input.changed{border-color:var(--cu);background:#FFF6EF}
.spec-row.internal{background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(181,98,45,.045) 7px 14px)}
.spec-row.hidden-row{opacity:.38;text-decoration:line-through}

/* costing workbench */
.cost-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;background:var(--pine);color:#E0EEE7;border-radius:var(--r-lg);overflow:hidden}
.cost-hero .l{padding:22px 24px}
.cost-hero .r{background:#0B261F;padding:18px 18px 10px;position:relative}
.cost-hero .big{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.035em;line-height:1;color:#fff}
.cost-hero .big small{font-size:22px;font-weight:500;color:#9DB8AC;margin-left:6px;letter-spacing:0}
.cost-hero .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:#9DB8AC}
.cost-hero .meta b{display:block;color:#fff;font-size:16px;font-family:var(--display);font-weight:600}
.cost-hero .pill{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;font-size:12px;color:#CFE3DA}
.cost-hero .pill i{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.cost-hero .pill.manual i{background:#E0B04A}
.unit-art{width:100%;height:auto;display:block}
.unit-art .part{cursor:pointer;transition:opacity .15s}
.unit-art.focus .part{opacity:.25}
.unit-art.focus .part.on{opacity:1}
.art-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:#B7CEC4;padding:8px 2px 4px}
.art-legend .mat i{width:9px;height:9px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--pine);color:#fff}

.row-x{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2);font-size:11.5px}
.chart .val{fill:var(--ink);font-size:11.5px;font-weight:600}
.chart .grid line{stroke:var(--line-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 9px;border-radius:7px;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip b{font-weight:600}

/* sliders */
.sl{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.sl input[type=range]{width:100%;accent-color:var(--pine)}
.sl .val{text-align:right;font-weight:600}
.sl .delta{font-size:12px}

/* SAP fetch */
.sap-steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.sap-steps li{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-3)}
.sap-steps li .k{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px}
.sap-steps li.run{color:var(--ink)}
.sap-steps li.run .k{border-color:var(--mint);border-right-color:transparent;animation:spin .7s linear infinite}
.sap-steps li.ok{color:var(--ink-2)}
.sap-steps li.ok .k{background:var(--mint);border-color:var(--mint);color:#06281D}

/* tree */
.tree{font-size:13.5px}
.tree details{margin-left:14px}
.tree summary{cursor:pointer;padding:5px 6px;border-radius:6px;list-style:none;display:flex;gap:8px;align-items:center}
.tree summary::-webkit-details-marker{display:none}
.tree summary:before{content:"▸";color:var(--ink-3);font-size:11px;transition:transform .15s}
.tree details[open]>summary:before{transform:rotate(90deg)}
.tree summary:hover{background:var(--paper-2)}
.tree .leaf{margin-left:30px;padding:6px 8px;border-radius:6px;display:flex;gap:10px;align-items:center;cursor:pointer}
.tree .leaf:hover{background:var(--mint-wash)}
.tree .ct{font-size:11.5px;color:var(--ink-3)}

/* diff */
.diff-up{color:var(--up);font-weight:600}.diff-dn{color:var(--down);font-weight:600}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper);cursor:pointer;position:relative}
.vcard.sel{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.vcard .vn{font-family:var(--display);font-weight:600;font-size:17px}

/* mail */
.mail{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.mail .mh{padding:12px 16px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:60px 1fr;gap:6px;font-size:13px}
.mail .mh span{color:var(--ink-3)}
.mail .mb{padding:16px;font-size:13.5px;white-space:pre-wrap}
.attach{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;margin:0 16px 16px;background:var(--paper-2)}

/* drawers / overlays */
.scrim{position:fixed;inset:0;background:rgba(9,25,20,.45);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--paper);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);animation:slide .22s ease-out}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--paper);z-index:2}
.drawer-h h3{flex:1}
.drawer-b{padding:18px 20px;display:grid;gap:14px}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.modal-wrap{position:fixed;inset:0;background:rgba(9,25,20,.45);z-index:70;display:grid;place-items:start center;padding-top:12vh}
.palette{width:min(620px,92vw);background:var(--paper);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.palette input{border:0;border-bottom:1px solid var(--line);width:100%;padding:16px 18px;font-size:16px;outline:none;background:var(--paper)}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer}
.palette .it.on,.palette .it:hover{background:var(--mint-wash)}
.palette .it .k{font-size:11.5px;color:var(--ink-3);margin-left:auto}

/* toasts + api inspector */
.toasts{position:fixed;right:18px;bottom:68px;z-index:95;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slide .2s ease-out;max-width:380px}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.toast.err i{background:#F08A78}
.api-pill{position:fixed;right:18px;bottom:18px;z-index:94;display:flex;align-items:center;gap:8px;background:var(--pine);color:#CFE3DA;border:0;border-radius:999px;padding:8px 14px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.api-pill i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.api-pill.busy i{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.api-panel{position:fixed;right:18px;bottom:62px;z-index:94;width:min(520px,92vw);max-height:46vh;overflow:auto;background:#0B1F19;color:#CFE3DA;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:12px}
.api-panel .hd{position:sticky;top:0;background:#0B1F19;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:8px;align-items:center}
.api-row{display:grid;grid-template-columns:52px 1fr 40px 54px;gap:8px;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.api-row .m{font-weight:700}.api-row .m.GET{color:#6EDDB4}.api-row .m.POST{color:#F2C46B}.api-row .m.PUT,.api-row .m.PATCH{color:#8DB8F2}
.api-row .p{color:#E7F1EC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api-row .s{color:#6EDDB4}.api-row .ms{color:#8FB0A3;text-align:right}

.demo-band{background:var(--warn-wash);color:var(--warn);font-size:12px;text-align:center;padding:4px 10px;border-bottom:1px solid #F0DCA8}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.bar-track{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:6px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--paper-2);border-radius:8px;padding:10px 12px;border:1px solid var(--line-2)}
.formula{font-size:12.5px;line-height:1.7;background:var(--paper-2);border-radius:8px;padding:10px 12px;border:1px solid var(--line-2)}
.formula .o{color:var(--ink-3)}
.upload{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--ink-2);cursor:pointer;background:var(--paper)}
.upload:hover{border-color:var(--pine-3)}

  const snap = {};
  COMMODITIES.forEach(c=>{ snap[c.code] = mode==='manual' ? manual[c.code] : c.q3; });
  return snap;
}
function landed(code, snap){
  const c = COMMODITIES.find(x=>x.code===code), fx = snap.FX, v = snap[code];
  const out = {code, steps:[], value:0, unit:'₹/kg'};
  if(c.structure==='lme'){
    const base = v*fx/1000, prem = base*c.premium;
    out.steps = [['Index '+c.index, v, c.unit],['× FX ÷ 1000 → base metal', base, '₹/kg'],['+ supplier premium '+(c.premium*100).toFixed(1)+'%', prem, '₹/kg'],['+ '+c.convLabel, c.conv, '₹/kg']];
    out.value = base+prem+c.conv;
  } else if(c.structure==='domestic'){
    const base = (v+c.spread)/1000;
    out.steps = [['HRC index', v, 'INR/MT'],['+ CRC/GI spread', c.spread, 'INR/MT'],['÷ 1000 → base', base, '₹/kg'],['+ inbound freight', c.freight, '₹/kg']];
    out.value = base + c.freight;
  } else if(c.structure==='polymer'){
    const base = v*fx/1000;
    out.steps = [['Styrene monomer index', v, c.unit],['× FX ÷ 1000', base, '₹/kg'],['+ compounding & masterbatch', c.compounding, '₹/kg']];
    out.value = base + c.compounding;
  } else if(c.structure==='import'){
    const cif = v*fx, bcd = cif*c.bcd, aidc = cif*c.aidc, sws = (bcd+aidc)*c.sws, clr = cif*c.clearing, igst=(cif+bcd+aidc+sws)*c.igst;
    out.unit = '₹/unit';
    out.steps = [['CIF USD × FX', cif, '₹'],['+ Basic customs duty 15%', bcd, '₹'],['+ AIDC 2.25%', aidc, '₹'],['+ Social welfare surcharge 10% on duty', sws, '₹'],['+ Clearing & port 1.5%', clr, '₹'],['IGST 18% (input credit, not costed)', igst, '₹', true]];
    out.value = cif+bcd+aidc+sws+clr;
  } else if(c.structure==='flat'){
    out.steps = [['Supplier rate', v, '₹/kg']]; out.value = v;
  } else { out.value = v; out.unit = c.unit; }
  return out;
}
function rates(snap){ const r={}; ['CU','AL','ST','PL','CP','RF'].forEach(k=>r[k]=landed(k,snap).value); return r; }

function engineWeights(model){
  const s=IDU_CHASSIS[model.idu].s, o=ODU_CHASSIS[model.odu].s, w={CU:0,AL:0,ST:0,PL:0,RF:0};
  IDU_LINES.forEach(l=>{ if(l.type==='mat') w[l.m]+=l.kg*s; });
  ODU_LINES.forEach(l=>{ if(l.type==='mat') w[l.m]+=l.kg*o; });
  model.excl.forEach(k=>{ const e=EXCLUSIVES[k]; if(e.type==='mat') w[e.m]+=e.kg; });
  return w;
}

function compute(model, snap, opts={}){
  const R = rates(snap), excl = opts.excl || model.excl, priceMode = opts.priceMode || 'lpp';
  const s = IDU_CHASSIS[model.idu].s, o = ODU_CHASSIS[model.odu], lines=[], byMat={CU:0,AL:0,ST:0,PL:0,RF:0,CP:0,BO:0};
  const boScale = x => x<1 ? .86 : x>1 ? 1.2 : 1;
  function add(unit, l, sc){
    let cost=0, kg=0, price=0, avg=0;
    if(l.type==='mat'){ kg=l.kg*sc; cost = kg*(1+l.scrap)*R[l.m] + l.proc*(sc>1?1.15:sc<1?.9:1); byMat[l.m]+=cost; }
    else if(l.type==='cp'){ cost = R.CP*o.cp; byMat.CP+=cost; }
    else { price = l.lpp*boScale(sc); avg = l.avg*boScale(sc); cost = priceMode==='avg'?avg:price; byMat.BO+=cost; }
    lines.push({unit, pc:l.pc+'-'+(unit==='IDU'?model.idu:model.odu), name:l.name, type:l.type, m:l.m, kg, cost, lpp:price, avg, zone:l.zone});
  }
  IDU_LINES.forEach(l=>add('IDU', l, s));
  ODU_LINES.forEach(l=>add('ODU', l, o.s));
  const common = lines.reduce((a,b)=>a+b.cost,0);
  const exLines = excl.map(k=>{ const e=EXCLUSIVES[k]; let cost = e.type==='mat' ? (e.kg*1.04*R[e.m]+e.proc) : (opts.exPrice&&opts.exPrice[k]!=null?opts.exPrice[k]:e.price); if(e.type==='mat') byMat[e.m]+=cost; else byMat.BO+=cost*e.sign; return {k, name:e.name, type:e.type, m:e.m, kg:e.kg||0, cost:cost*e.sign, sign:e.sign}; });
  const exclusive = exLines.reduce((a,b)=>a+b.cost,0);
  const material = common + exclusive;
  const assembly = OVERHEADS.assembly.IDU + OVERHEADS.assembly.ODU;
  const freight = material*OVERHEADS.freightPct, warranty = material*OVERHEADS.warrantyPct;
  const ct = OVERHEADS.contingency, contRaw = ct.amount/ct.lotQty, contCap = material*ct.capPct, contingency = opts.noCont?0:Math.min(contRaw, contCap);
  const cost = material + assembly + freight + warranty + contingency;
  const margin = cost*OVERHEADS.marginPct;
  const total = cost + margin;
  const weights = engineWeights({...model, excl});
  return {lines, exLines, common, exclusive, material, assembly, freight, warranty, contingency, contRaw, contCap, cost, margin, total, byMat, weights, R};
}

const fmt = {
  inr:(v,d=0)=>'₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:d, minimumFractionDigits:d}),
  n:(v,d=0)=>Number(v).toLocaleString('en-IN',{maximumFractionDigits:d, minimumFractionDigits:d}),
  pct:(v,d=1)=>(v>0?'+':'')+(v*100).toFixed(d)+'%',
  k:(v)=>Math.abs(v)>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':Math.abs(v)>=1e5?'₹'+(v/1e5).toFixed(2)+' L':fmt.inr(v)
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function spark(vals, w=70, h=22, color='#6EDDB4'){
  const mn=Math.min(...vals), mx=Math.max(...vals), sx=w/(vals.length-1), sy=v=>h-2-((v-mn)/((mx-mn)||1))*(h-4);
  const d=vals.map((v,i)=>(i?'L':'M')+(i*sx).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* Waterfall: steps [{label, value, kind:'add'|'sub'|'total', color}] */
function waterfall(steps, opts={}){
  const W=opts.w||640, H=opts.h||250, padL=8, padB=40, padT=22;
  let run=0; const bars=steps.map(s=>{ if(s.kind==='total'){ const b={...s, y0:0, y1:s.value}; run=s.value; return b; } const y0=run; run+=s.value; return {...s, y0, y1:run}; });
  const mx=Math.max(...bars.map(b=>Math.max(b.y0,b.y1)))*1.08;
  const bw=(W-padL*2)/bars.length, gap=Math.min(14, bw*.28), sy=v=>padT+(H-padB-padT)*(1-v/mx);
  let g='';
  for(let i=0;i<4;i++){ const v=mx*i/4, y=sy(v); g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  let marks='', labels='';
  bars.forEach((b,i)=>{
    const x=padL+i*bw+gap/2, w=bw-gap, top=sy(Math.max(b.y0,b.y1)), bot=sy(Math.min(b.y0,b.y1)), hgt=Math.max(2,bot-top);
    const col=b.color || (b.kind==='total'?'#0E2E25':b.value<0?'#1A8259':'#B5622D');
    marks+=`<rect x="${x}" y="${top}" width="${w}" height="${hgt}" rx="4" fill="${col}" data-tip="<b>${esc(b.label)}</b><br>${b.kind==='total'?'':(b.value<0?'− ':'+ ')}${fmt.inr(Math.abs(b.value))}${b.kind==='total'?'':'<br>Running: '+fmt.inr(b.y1)}" style="transform-origin:${x+w/2}px ${H-padB}px;animation:grow .5s ${i*.05}s both ease-out"/>`;
    if(i<bars.length-1 && b.kind!=='total'){ const nx=padL+(i+1)*bw+gap/2; marks+=`<line x1="${x+w}" x2="${nx}" y1="${sy(b.y1)}" y2="${sy(b.y1)}" stroke="#9AA8A1" stroke-dasharray="2 3"/>`; }
    labels+=`<text class="val" x="${x+w/2}" y="${top-6}" text-anchor="middle">${fmt.k(Math.abs(b.kind==='total'?b.y1:b.value))}</text>`;
    const words=b.label.split(' '); const l1=words.slice(0,2).join(' '), l2=words.slice(2).join(' ');
    labels+=`<text class="lbl" x="${x+w/2}" y="${H-padB+16}" text-anchor="middle">${esc(l1)}</text>`+(l2?`<text class="lbl" x="${x+w/2}" y="${H-padB+30}" text-anchor="middle">${esc(l2)}</text>`:'');
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost build-up waterfall"><style>@keyframes grow{from{transform:scaleY(0)}}@media (prefers-reduced-motion:reduce){rect{animation:none!important}}</style><g class="grid">${g}</g>${marks}${labels}</svg></div>`;
}

/* Donut: parts [{label, value, color}] */
function donut(parts, opts={}){
  const S=opts.size||180, r=S/2-10, ir=r-22, cx=S/2, cy=S/2, tot=parts.reduce((a,b)=>a+b.value,0);
  let a0=-Math.PI/2, out='';
  parts.forEach(p=>{
    const a1=a0+(p.value/tot)*Math.PI*2, large=(a1-a0)>Math.PI?1:0;
    const p1=[cx+r*Math.cos(a0), cy+r*Math.sin(a0)], p2=[cx+r*Math.cos(a1), cy+r*Math.sin(a1)], p3=[cx+ir*Math.cos(a1), cy+ir*Math.sin(a1)], p4=[cx+ir*Math.cos(a0), cy+ir*Math.sin(a0)];
    out+=`<path d="M${p1} A${r} ${r} 0 ${large} 1 ${p2} L${p3} A${ir} ${ir} 0 ${large} 0 ${p4}Z" fill="${p.color}" stroke="var(--paper)" stroke-width="2" data-tip="<b>${esc(p.label)}</b><br>${opts.unit==='kg'?fmt.n(p.value,2)+' kg':fmt.inr(p.value)} (${(p.value/tot*100).toFixed(1)}%)"/>`;
    a0=a1;
  });
  const center = opts.center ? `<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-family:var(--display);font-size:20px;font-weight:600;fill:var(--ink)">${opts.center}</text><text x="${cx}" y="${cy+16}" text-anchor="middle">${opts.centerSub||''}</text>` : '';
  return `<div class="chart" style="max-width:${S}px"><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(opts.label||'Breakdown')}">${out}${center}</svg></div>`;
}

/* Line: one or more series over labels; single y-axis */
function lineChart(series, labels, opts={}){
  const W=opts.w||640, H=opts.h||220, padL=48, padR=14, padT=12, padB=26;
  const all=series.flatMap(s=>s.values).filter(v=>v!=null), mn=Math.min(...all)*.97, mx=Math.max(...all)*1.02;
  const sx=i=>padL+i*((W-padL-padR)/(labels.length-1)), sy=v=>padT+(H-padT-padB)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=sy(v); g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${padL-8}" y="${y+4}" text-anchor="end">${fmt.n(v, v<200?1:0)}</text>`; }
  const xl=labels.map((l,i)=>`<text x="${sx(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`).join('');
  let paths='', dots='';
  series.forEach(s=>{
    const d=s.values.map((v,i)=>v==null?'':((i&&s.values[i-1]!=null?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1))).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`;
    s.values.forEach((v,i)=>{ if(v==null) return; dots+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="${(opts.mark&&opts.mark.includes(i))?5:3.2}" fill="${s.color}" stroke="var(--paper)" stroke-width="2" data-tip="<b>${esc(labels[i])}</b><br>${esc(s.name)}: ${fmt.n(v,2)}"/><circle cx="${sx(i)}" cy="${sy(v)}" r="12" fill="transparent" data-tip="<b>${esc(labels[i])}</b><br>${esc(s.name)}: ${fmt.n(v,2)}"/>`; });
  });
  const band = opts.band!=null ? `<rect x="${sx(opts.band[0])-8}" y="${padT}" width="${sx(opts.band[1])-sx(opts.band[0])+16}" height="${H-padT-padB}" fill="#36C79A" opacity=".10" rx="6"/>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Trend')}"><g class="grid">${g}</g>${band}${xl}${paths}${dots}</svg></div>`;
}

/* Diverging horizontal bars: items [{label, value, color}] value in ₹ (+ cost up) */
function divBars(items, opts={}){
  const W=opts.w||560, rowH=30, H=items.length*rowH+10, mid=W*0.55, lblW=150;
  const mx=Math.max(1,...items.map(i=>Math.abs(i.value)));
  const sc=v=>(Math.abs(v)/mx)*((W-mid)-60);
  let out=`<line x1="${mid}" x2="${mid}" y1="0" y2="${H}" stroke="#9AA8A1"/>`;
  items.forEach((it,i)=>{
    const y=i*rowH+6, w=Math.max(it.value?2:0, sc(it.value)), x=it.value>=0?mid:mid-w;
    out+=`<text class="lbl" x="${mid-sc(Math.min(0,it.value))-8 - (it.value<0?0:0)}" y="${y+15}" text-anchor="end">${esc(it.label)}</text>`;
    out+=`<rect x="${x}" y="${y+3}" width="${w}" height="16" rx="4" fill="${it.color}" data-tip="<b>${esc(it.label)}</b><br>${it.value>=0?'+':'−'}${fmt.inr(Math.abs(it.value))} per set"/>`;
    out+=`<text class="val" x="${it.value>=0?mid+w+6:mid+6}" y="${y+15}">${it.value>=0?'+':'−'}${fmt.inr(Math.abs(it.value))}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Impact by commodity">${out}</svg></div>`;
}

/* Hover layer for every [data-tip] mark */
(function(){
  let tip;
  document.addEventListener('mousemove', e=>{
    const t = e.target.closest && e.target.closest('[data-tip]');
    if(!t){ if(tip) tip.style.display='none'; return; }
    if(!tip){ tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); }
    tip.innerHTML = t.getAttribute('data-tip'); tip.style.display='block';
    const x = Math.min(window.innerWidth-tip.offsetWidth-12, e.clientX+14), y = Math.max(8, e.clientY-tip.offsetHeight-10);
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
})();

function specLabel(k){ for(const [,rows] of SPEC_TEMPLATE) for(const r of rows) if(r[0]===k) return r[1]; return k; }
function specRows(includeInternalSection){ const out=[]; SPEC_TEMPLATE.forEach(([sec,rows])=>{ const internalSec = sec.startsWith('Internal'); if(internalSec && !includeInternalSection) return; rows.forEach(r=>out.push({sec, k:r[0], label:r[1], internal:!!r[2]||internalSec})); }); return out; }

async function viewSpecSheet(el, r, token){
  el.innerHTML = loader('Loading spec sheet');
  await api.requests(); if(stale(token)) return;
  const x = reqById(r.id), m=model(x.model), role=APP.user.role;
  const editable = role==='rnd' && x.assignee===APP.user.id && ['RND','ALLOCATED','RETURNED'].includes(x.status);
  const seeInternal = role==='costing';
  const rows = specRows(seeInternal);
  APP.spec.draft = {};
  const total = specRows(true).length, cust = specRows(true).filter(r=>!r.internal).length;
  let secs='', n=0;
  SPEC_TEMPLATE.forEach(([sec])=>{
    const rs = rows.filter(r=>r.sec===sec); if(!rs.length) return;
    secs += `<div class="spec-sec"><h4>${esc(sec)} ${sec.startsWith('Internal')?'<span class="chip warn">Costing only</span>':''}</h4>${rs.map(rw=>{ n++; return `<div class="spec-row ${rw.internal?'internal':''}"><span class="no num">${n}</span><span>${esc(rw.label)}</span><input data-k="${rw.k}" value="${esc(x.spec[rw.k])}" ${editable && !rw.k.match(/^(cuKg|alKg|stKg|plKg|chRef|commonPct|exclRef)$/)?'':'readonly'} aria-label="${esc(rw.label)}"><span class="x small ${rw.internal?'':'muted'}">${rw.internal?'Internal only':'Customer sheet'}</span></div>`; }).join('')}</div>`;
  });
  el.innerHTML = `
  <div class="page-head"><div class="t"><div class="crumbs"><a href="#/requests">Requests</a> / <a href="#/requests/${x.id}">${x.id}</a> / Spec sheet</div><h1>Spec sheet: ${esc(m.code)}</h1>
    <p>${esc(m.name)}. ${total} rows internally; ${cust} rows go to the customer. Rows marked internal are stripped automatically from the customer sheet.</p></div>
    <div class="row-x">${stPill(x.status)}
    ${editable?`<button class="btn" data-act="spec-save" data-id="${x.id}" id="specSave" disabled>Save changes</button><button class="btn primary" data-act="spec-submit" data-id="${x.id}">Submit for approval</button>`:''}
    ${role==='lead'&&x.status==='SUBMITTED'?`<button class="btn" data-act="go" data-to="requests/${x.id}">Approve or return</button>`:''}
    ${role==='costing'&&['APPROVED','COSTING','COSTED','SENT'].includes(x.status)?`<button class="btn primary" data-act="go" data-to="costing/${x.id}">Open costing</button>`:''}</div></div>
  ${!editable?`<div class="note" style="margin-bottom:12px">${role==='rnd'?'This spec is read-only: it is not assigned to you, or it has already been submitted.':'Read-only for '+ROLES[role].label+'. Only the assigned R&D engineer can edit specifications.'}</div>`:`<div class="note" style="margin-bottom:12px">Edit any field. Changed fields turn copper; saving writes each change to the audit log.</div>`}
  <div class="panel"><div class="panel-b">${secs}</div></div>`;
  if(editable) $$('.spec-row input:not([readonly])').forEach(i=>i.addEventListener('input',()=>{ const k=i.dataset.k; if(i.value!==String(x.spec[k])){ APP.spec.draft[k]=i.value; i.classList.add('changed'); } else { delete APP.spec.draft[k]; i.classList.remove('changed'); } $('#specSave').disabled=!Object.keys(APP.spec.draft).length; $('#specSave').textContent = Object.keys(APP.spec.draft).length?'Save '+Object.keys(APP.spec.draft).length+' change'+(Object.keys(APP.spec.draft).length>1?'s':''):'Save changes'; }));
}

/* ===== Costing, commodities, simulation, SAP BOM, history, customer sheet, library, admin ===== */
const ZONE_MAT = {coil:'CU', fan:'PL', body:'PL', louver:'PL', plate:'ST', pcb:'BO', cabinet:'ST', base:'ST', comp:'CP', pipe:'RF'};
const ZONE_NAME = {coil:'Heat exchanger coil', fan:'Fan & motor', body:'Body mouldings', louver:'Louvers & swing', plate:'Mounting plate', pcb:'Electronics', cabinet:'Cabinet', base:'Base & mounts', comp:'Compressor', pipe:'Piping & refrigerant'};
const matColor = m=>COLORS[m]||'#9AA8A1';

function unitArt(c, focus){
  const z={}; c.lines.forEach(l=>{ const k=l.unit+':'+l.zone; z[k]=(z[k]||0)+l.cost; });
  const part=(k, inner)=>{ const [u,zn]=k.split(':'); return `<g class="part ${focus===k?'on':''}" data-act="wb-zone" data-z="${k}" data-tip="<b>${u} ${ZONE_NAME[zn]}</b><br>${fmt.inr(z[k]||0)} per set<br>Click to filter parts">${inner}</g>`; };
  const fin=(x,y,w,h)=>{ let s=''; for(let i=x+4;i<x+w;i+=6) s+=`<line x1="${i}" y1="${y+2}" x2="${i}" y2="${y+h-2}" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`; return s; };

    const rateEff = same ? mid-a.total : null, scopeEff = same ? b.total-mid : null;

      <div class="grid g3" style="margin:6px 0 14px"><div><div class="small sub">${a.quarter}</div><div class="kpi" style="padding:0"><div class="v num">${fmt.inr(a.total)}</div></div></div><div><div class="small sub">${b.quarter}</div><div class="kpi" style="padding:0"><div class="v num">${fmt.inr(b.total)}</div></div></div><div><div class="small sub">Change</div><div class="kpi" style="padding:0"><div class="v num ${b.total>a.total?'diff-up':'diff-dn'}">${b.total>a.total?'+':'−'}${fmt.inr(Math.abs(b.total-a.total))}</div></div></div></div>
      ${same?`<div class="formula"><div class="row-x"><span>Commodity rates moved</span><span class="spacer"></span><b class="num ${rateEff>0?'diff-up':'diff-dn'}">${rateEff>=0?'+':'−'}${fmt.inr(Math.abs(rateEff))}</b></div><div class="row-x"><span>Scope changed (exclusive parts)</span><span class="spacer"></span><b class="num ${scopeEff>0?'diff-up':scopeEff<0?'diff-dn':''}">${scopeEff>=0?'+':'−'}${fmt.inr(Math.abs(scopeEff))}</b></div></div>`:''}
      <table class="tbl" style="margin-top:12px"><thead><tr><th>Rate</th><th class="r">v${a.v}</th><th class="r">v${b.v}</th><th class="r">Change</th></tr></thead><tbody>
      ${SIM_KEYS.map(([k,l])=>{ const d=(b.snap[k]-a.snap[k])/a.snap[k]; return `<tr><td><span class="mat"><i style="background:${k==='FX'?'#465650':COLORS[k]}"></i>${l}</span></td><td class="r num">${fmt.n(a.snap[k],a.snap[k]<200?2:0)}</td><td class="r num">${fmt.n(b.snap[k],b.snap[k]<200?2:0)}</td><td class="r num ${d>0.0005?'diff-up':d<-0.0005?'diff-dn':''}">${fmt.pct(d)}</td></tr>`; }).join('')}
      </tbody></table>
      ${added.length||removed.length?`<div class="row-x" style="margin-top:10px">${added.map(k=>`<span class="chip ${EXCLUSIVES[k].sign>0?'up':'down'}">Added: ${esc(EXCLUSIVES[k].name)}</span>`).join('')}${removed.map(k=>`<span class="chip ${EXCLUSIVES[k].sign>0?'down':'up'}">Removed: ${esc(EXCLUSIVES[k].name)}</span>`).join('')}</div>`:''}
    </div></div>`;
  } else if(sel.length===1){
    const v=sel[0], m=model(v.model);
    diff = `<div class="panel"><div class="panel-h"><h3>${esc(m.brand)} ${m.code}, v${v.v}</h3><span class="chip ${v.status==='SENT'?'dark':'warn'}">${v.status==='SENT'?'Sent':'Draft'}</span></div><div class="panel-b">
      <div class="kpi" style="padding:0 0 10px"><div class="v num">${fmt.inr(v.total)}</div><div class="f">per set, ${v.quarter}</div></div>
      <table class="tbl"><tbody><tr><td class="muted">Request</td><td>${v.req}</td></tr><tr><td class="muted">Costed by</td><td>${esc(person(v.by).name)} on ${v.on}</td></tr><tr><td class="muted">Rate source</td><td>${v.source}, basis ${v.basis.replace('-',' ')}</td></tr><tr><td class="muted">Copper used</td><td class="num">${fmt.n(v.snap.CU,2)} USD/MT</td></tr><tr><td class="muted">Sent to</td><td>${v.status==='SENT'?esc(v.sentTo):'Not sent yet'}</td></tr>${v.note?`<tr><td class="muted">Note</td><td>${esc(v.note)}</td></tr>`:''}</tbody></table>
      <div class="row-x" style="margin-top:12px"><span class="small muted">Pick a second version to compare.</span><span class="spacer"></span><button class="btn primary" data-act="go" data-to="customer/${v.id}">Customer sheet</button></div></div></div>`;
  } else diff = `<div class="lock-note"><div class="ic">⇆</div><div><b>Pick a version to see exactly what was quoted.</b><div class="small">Pick two to compare: the change is split into commodity movement and scope change.</div></div></div>`;
  el.innerHTML = `<div class="page-head"><div class="t"><h1>Quote history</h1><p>Every costing ever sent, with the rates and parts it used. Answer "what did we give whom, and why" two years later.</p></div></div>
  <div class="grid g-main"><div class="panel"><div class="panel-b">
    <input class="inp" id="histQ" placeholder="Search: Voltas, Q2 2025, REQ-2603…" value="${esc(H.q)}" style="margin-bottom:10px" aria-label="Search quote history">
    <table class="tbl"><thead><tr><th></th><th>Model</th><th>Version</th><th>Quarter</th><th>Source</th><th class="r">Quote / set</th></tr></thead><tbody>
    ${list.map(v=>{ const m=model(v.model); return `<tr class="click" data-act="hist-pick" data-id="${v.id}" style="${H.sel.includes(v.id)?'background:var(--mint-wash)':''}"><td><input type="checkbox" ${H.sel.includes(v.id)?'checked':''} tabindex="-1" aria-label="Select"></td><td>${brandDot(m.brand)} <span class="small muted">${m.code}</span></td><td>v${v.v} ${v.status==='DRAFT'?'<span class="chip warn">Draft</span>':''}</td><td class="small">${v.quarter}<div class="muted">${v.on}</div></td><td><span class="chip ${v.source==='AICM'?'mint':''}">${v.source}</span></td><td class="r num"><b>${fmt.inr(v.total)}</b></td></tr>`; }).join('')||'<tr><td colspan="6" class="empty">No quotes match. Try a brand, quarter or request ID.</td></tr>'}
    </tbody></table></div></div>
    <div>${diff}</div></div>`;
  const inp=$('#histQ'); inp.addEventListener('input',()=>{ APP.hist.q=inp.value; const pos=inp.selectionStart; viewHistory(el,{}); const n=$('#histQ'); n.focus(); n.setSelectionRange(pos,pos); });
}
ACT['hist-pick'] = el=>{ const H=APP.hist, id=el.dataset.id; if(H.sel.includes(id)) H.sel=H.sel.filter(x=>x!==id); else { H.sel.push(id); if(H.sel.length>2) H.sel.shift(); } if(location.hash.startsWith('#/history/')) history.replaceState(null,'','#/history'); viewHistory($('#view'),{}); };

/* ---------- customer sheet & send ---------- */
function viewCustomer(el, r){
  const v=DB.versions.find(x=>x.id===r.id); if(!v){ el.innerHTML='<div class="empty">Version not found.</div>'; return; }
  const m=model(v.model), req=reqById(v.req), spec = req?req.spec:specFor(m), all=specRows(true);
  const custRows=all.filter(x=>!x.internal);
  const view = APP.custView||'customer';
  const rows = view==='customer'?custRows:all;
  el.innerHTML = `<div class="page-head"><div class="t"><div class="crumbs"><a href="#/history">Quote history</a> / ${m.code} v${v.v}</div><h1>Customer sheet: ${esc(m.name)}</h1><p>Derived automatically from the internal costing sheet. The same ${all.length-custRows.length} internal rows are always removed, so the customer sheet never needs to be built by hand.</p></div>
    <div class="row-x"><div class="seg"><button class="${view==='customer'?'on':''}" data-act="cust-view" data-v="customer">Customer view, ${custRows.length} rows</button><button class="${view==='internal'?'on':''}" data-act="cust-view" data-v="internal">Internal view, ${all.length} rows</button></div></div></div>
  <div class="grid g-main"><div class="panel"><div class="panel-h"><h3>${esc(m.brand)} ${m.code}, quotation v${v.v}</h3><span class="chip">${v.quarter}</span></div><div class="panel-b">
    <div class="row-x" style="padding:10px 12px;background:var(--paper-2);border-radius:8px;margin-bottom:8px"><div><div class="small sub">Price per set, IDU + ODU, ex-works</div><div style="font-family:var(--display);font-size:26px;font-weight:600" class="num">${fmt.inr(v.total)}</div></div><span class="spacer"></span><div class="small sub" style="text-align:right">Valid for ${v.quarter}<br>Prices linked to commodity indices</div></div>
    ${rows.map((rw,i)=>`<div class="spec-row ${rw.internal?'internal':''}" style="grid-template-columns:34px 1fr 1.2fr ${view==='internal'?'110px':''}"><span class="no num">${i+1}</span><span>${esc(rw.label)}</span><span><b style="font-weight:500">${esc(spec[rw.k]||'—')}</b></span>${view==='internal'?`<span class="x small ${rw.internal?'':'muted'}">${rw.internal?'Removed for customer':'Sent'}</span>`:''}</div>`).join('')}
  </div></div>
  <div class="grid" style="align-content:start">${can('costing')?`<div class="mail"><div class="mh"><span>From</span><b>costing@ambergroupindia.com</b><span>To</span><input class="inp" id="mailTo" value="${esc(v.sentTo)}" aria-label="Recipient"><span>Subject</span><b>${esc(m.brand)} ${m.code}: quotation v${v.v} for ${v.quarter}</b></div>
    <div class="mb">Dear ${esc(m.brand)} sourcing team,

Please find attached our quotation for ${esc(m.name)} (${m.code}), valid for ${v.quarter}.

Price per set (IDU + ODU): ${fmt.inr(v.total)}, ex-works, linked to the ${v.basis==='Manual'?'agreed':'previous quarter\'s average'} copper, aluminium and USD/INR rates.

Regards,
${esc(APP.user.name)}
Costing, Amber Enterprises</div>
    <span class="attach">📄 ${m.code}_Quotation_v${v.v}.pdf <span class="muted">${custRows.length} rows, generated</span></span>
    <div style="padding:0 16px 16px" class="row-x">${v.status==='SENT'?`<span class="chip dark"><span class="d"></span>Sent to ${esc(v.sentTo)}</span><span class="spacer"></span><button class="btn" data-act="mail-send" data-id="${v.id}">Send again</button>`:`<span class="small muted">Sent from the system and logged against ${v.req}.</span><span class="spacer"></span><button class="btn primary" data-act="mail-send" data-id="${v.id}">Send to customer</button>`}</div></div>`:`<div class="note">Only the costing team can send quotations.</div>`}
    <div class="panel"><div class="panel-h"><h3>Removed for the customer</h3><span class="chip warn">${all.length-custRows.length} rows</span></div><div class="panel-b small">${all.filter(x=>x.internal).map(x=>esc(x.label)).join(', ')}</div></div>
  </div></div>`;
}
ACT['cust-view'] = el=>{ APP.custView=el.dataset.v; render(); };
ACT['mail-send'] = async el=>{ const to=$('#mailTo').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ toast('Enter a valid customer email address', true); $('#mailTo').focus(); return; } el.disabled=true; el.innerHTML='<span class="sp"></span>Sending'; await api.sendMail(el.dataset.id, to, APP.user.id); toast('Quotation sent to '+to+' and logged'); renderShell(); render(); };

/* ---------- library ---------- */
function viewLibrary(el, r){
  const L=APP.lib; if(r.id) L.sel=r.id; const q=L.q.toLowerCase();
  const showCost = can('costing');
  const ms = MODELS.filter(m=>!q || (m.name+' '+m.code+' '+m.idu+' '+m.odu).toLowerCase().includes(q));
  const tree = BRANDS.filter(b=>ms.some(m=>m.brand===b)).map(b=>{ const bm=ms.filter(m=>m.brand===b); return `<details open><summary><b>${esc(b)}</b><span class="ct">${bm.length} model${bm.length>1?'s':''}</span></summary>
    ${[...new Set(bm.map(m=>m.series))].map(s=>`<details open><summary>${esc(s)}</summary>${bm.filter(m=>m.series===s).map(m=>`<div class="leaf" data-act="lib-sel" data-id="${m.id}" style="${L.sel===m.id?'background:var(--mint-wash)':''}"><span class="chip">${m.idu} + ${m.odu}</span>${esc(m.code)}<span class="ct">${m.tr} TR</span></div>`).join('')}</details>`).join('')}</details>`; }).join('');
  let card='<div class="lock-note"><div class="ic">▤</div><div><b>Pick a model to see its spec, chassis and quote history.</b><div class="small">Organised by customer, then series, then model. Every record lives in one place.</div></div></div>';
  if(L.sel){ const m=model(L.sel), vs=DB.versions.filter(v=>v.model===m.id).sort((a,b)=>a.v-b.v), rq=DB.requests.filter(x=>x.model===m.id);
    card = `<div class="panel"><div class="panel-h"><h3>${esc(m.name)}</h3><span class="chip">${m.code}</span></div><div class="panel-b">
      <table class="tbl"><tbody><tr><td class="muted">Customer</td><td>${brandDot(m.brand)}</td></tr><tr><td class="muted">Path</td><td class="small">${esc(m.brand)} / ${esc(m.series)} / ${m.idu} + ${m.odu} / ${m.code}</td></tr><tr><td class="muted">Chassis</td><td>${IDU_CHASSIS[m.idu].label}<br>${ODU_CHASSIS[m.odu].label}</td></tr><tr><td class="muted">Rating</td><td>${m.tr} TR, ${m.star}-star, ISEER ${m.iseer}</td></tr><tr><td class="muted">Exclusive parts</td><td class="small">${m.excl.map(k=>esc(EXCLUSIVES[k].name)).join(', ')}</td></tr></tbody></table>
      ${showCost&&vs.length?`<h3 style="margin:16px 0 6px">Quote trend</h3>${lineChart([{name:'Quote per set', values:vs.map(v=>v.total), color:'#0E2E25'}], vs.map(v=>'v'+v.v+' '+v.quarter.replace(' 20',' \'')), {h:170,label:'Quote trend'})}`:''}
      ${!showCost?'<div class="note" style="margin-top:12px">Prices are visible to the costing team only.</div>':''}
      <h3 style="margin:16px 0 6px">Requests</h3>${rq.length?rq.map(x=>`<div class="row-x" style="padding:5px 0"><a href="#/requests/${x.id}">${x.id}</a>${stPill(x.status)}<span class="spacer"></span><span class="small muted">${x.received}</span></div>`).join(''):'<div class="small muted">No open requests.</div>'}
    </div></div>`; }
  el.innerHTML = `<div class="page-head"><div class="t"><h1>Library</h1><p>All ${MODELS.length} models across ${BRANDS.length} customers, filed by customer, series and chassis so anything can be found by name.</p></div></div>
  <div class="grid g2" style="grid-template-columns:minmax(280px,.8fr) 1.2fr"><div class="panel"><div class="panel-b"><input class="inp" id="libQ" placeholder="Search models, codes, chassis" value="${esc(L.q)}" style="margin-bottom:10px" aria-label="Search library"><div class="tree">${tree||'<div class="empty">No models match.</div>'}</div></div></div><div>${card}</div></div>`;
  const inp=$('#libQ'); inp.addEventListener('input',()=>{ APP.lib.q=inp.value; const p=inp.selectionStart; viewLibrary(el,{}); const n=$('#libQ'); n.focus(); n.setSelectionRange(p,p); });
}
ACT['lib-sel'] = el=>{ APP.lib.sel=el.dataset.id; viewLibrary($('#view'),{}); };

/* ---------- admin ---------- */
async function viewAdmin(el, r, token){
  el.innerHTML = loader('Loading users and audit trail');
  const log = await api.audit(); if(stale(token)) return;
  const mods = MODULES.filter(m=>m.id!=='home');
  el.innerHTML = `<div class="page-head"><div class="t"><h1>Admin</h1><p>Who can see what. Costing data is confidential, so access is role-based and every change is logged.</p></div><button class="btn danger" data-act="reset">Reset demo data</button></div>
  <div class="grid g2">
    <div class="panel"><div class="panel-h"><h3>Users</h3><span class="chip">${Object.keys(PEOPLE).length}</span></div><div class="panel-b"><table class="tbl"><tbody>${Object.values(PEOPLE).map(p=>`<tr><td>${av(p.id,28)}</td><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.title)}</div></td><td><span class="chip">${ROLES[p.role].label}</span></td><td class="r small muted">Password + SSO</td></tr>`).join('')}</tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h3>Permissions by role</h3></div><div class="panel-b" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Module</th>${Object.values(ROLES).map(r=>`<th style="text-align:center">${r.label}</th>`).join('')}</tr></thead><tbody>${mods.map(m=>`<tr><td>${m.label}</td>${Object.keys(ROLES).map(k=>`<td style="text-align:center">${ROLES[k].modules.includes(m.id)?'<span style="color:var(--down);font-weight:700">✓</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join('')}
      <tr><td>Edit spec sheet</td>${Object.keys(ROLES).map(k=>`<td style="text-align:center">${k==='rnd'?'<span style="color:var(--down);font-weight:700">✓</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr>
      <tr><td>Approve spec</td>${Object.keys(ROLES).map(k=>`<td style="text-align:center">${k==='lead'?'<span style="color:var(--down);font-weight:700">✓</span>':'<span class="muted">—</span>'}</td>`).join('')}</tr></tbody></table></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Audit trail</h3><span class="chip">${log.length} events</span></div><div class="panel-b"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th></tr></thead><tbody>${log.map(a=>`<tr><td class="small num">${a.t}</td><td>${av(a.who,22)} ${esc(person(a.who).name)}</td><td>${esc(a.a)}</td><td class="small">${esc(a.obj)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------- boot ---------- */
loadDB();
render();

</script></body></html>
